version: 2

updates:
  # Runtime + build dependencies. Grouped so a routine bump is one reviewable
  # PR rather than a dozen; `dist/` is regenerated at release time, so these
  # PRs intentionally touch source and lockfile only.
  - package-ecosystem: npm
    directory: "/"
    # Monthly (first of the month) keeps routine bumps to one grouped PR a
    # month. This schedule governs version updates only: security updates are
    # raised as soon as an advisory is published, whatever the schedule, and
    # arrive grouped via the `security` group below.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # `@vercel/ncc` is the bundler that produces `dist/bundle/index.js` — the
    # committed artifact MCP hosts actually execute. A bundler bump therefore
    # changes shipped output, so it must never ride along in a grouped PR.
    #
    # This is not theoretical: PR #47 grouped 0.38.4 -> 0.44.1 in with three
    # harmless dev updates and broke `npm run bundle` outright with
    # `TypeError: N.hash is not a function` on Node 18, 20 and 22. Minor bumps
    # of a 0.x package are routinely breaking, so only patches are allowed
    # through, and they arrive as their own reviewable PR.
    ignore:
      - dependency-name: "@vercel/ncc"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # TypeScript 7 drops the JS compiler API that ncc's ts-loader calls, so
      # `npm run bundle` fails ("reading 'fileExists'"). Held until the bundler
      # question is settled — see issue #85, and remove this entry then.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

    # Grouping is deliberately broad. The first configuration only grouped dev
    # minor/patch and production *patch*, which left every production **minor**
    # to open its own PR — that is how one week produced seven separate PRs
    # (hono, fast-uri, ip-address/express-rate-limit, postcss, plus two action
    # bumps and the dev group). Because `required_status_checks.strict` is true,
    # each merge staleness-invalidates the rest of the queue, so seven PRs means
    # seven rebase-and-recheck cycles and seven approvals. One PR per run per
    # ecosystem is the point.
    #
    # Majors are deliberately NOT grouped — those still arrive individually,
    # because a major deserves its own review.
    groups:
      production:
        dependency-type: production
        update-types: [ minor, patch ]
      development:
        dependency-type: development
        update-types: [ minor, patch ]
        exclude-patterns:
          - "@vercel/ncc"
      # Security updates ignore every group above: a group without `applies-to`
      # defaults to `version-updates`, so each open alert raised its own PR.
      # That is how October produced ten separate PRs (fast-uri, vitest, MCP
      # SDK, hono, vite, source-map-js, proxy-addr, ip-address, esbuild, qs)
      # that had to be consolidated by hand in one roundup PR. This group
      # bundles them into one PR per run. `@vercel/ncc` stays out for the same
      # reason as above — a bundler change must be reviewed on its own.
      security:
        applies-to: security-updates
        patterns: [ "*" ]
        exclude-patterns:
          - "@vercel/ncc"

  # Keeps `actions/checkout`, `actions/setup-node` etc. current. Worth having
  # even though only first-party actions are used today: it is the mechanism
  # that will surface a required bump if that ever changes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    # Without this, each action bump is its own PR.
    groups:
      github-actions:
        patterns: [ "*" ]
